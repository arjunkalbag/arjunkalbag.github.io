<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Photography — Arjun Kalbag</title>
<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="description" content="Photography by Arjun Kalbag." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Photography — Arjun Kalbag" />
<meta property="og:image" content="https://arjunkalbag.xyz/og-cover.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://arjunkalbag.xyz/og-cover.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#f2f1ec; --ink:#141414; --faint:#8a8a8a; --chip:rgba(242,241,236,0.72); --chipbd:rgba(0,0,0,0.14); }
  html.dark { --bg:#0b0b0c; --ink:#f2f2f2; --faint:#7a7a7a; --chip:rgba(11,11,12,0.6); --chipbd:rgba(255,255,255,0.16); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); color:var(--ink); font-family:'JetBrains Mono',ui-monospace,monospace; -webkit-font-smoothing:antialiased; }
  #field { position:fixed; inset:0; overflow:hidden; z-index:1; cursor:grab; touch-action:none; }
  #field.drag { cursor:grabbing; }
  .ph { position:absolute; top:0; left:0; will-change:transform; opacity:0; transition:opacity 1s ease; }
  .ph.on { opacity:1; }
  .ph img { display:block; width:100%; height:auto; border-radius:3px; box-shadow:0 16px 44px rgba(0,0,0,0.26); background:rgba(128,128,128,0.1); pointer-events:none; }
  .top { position:fixed; top:0; left:0; right:0; z-index:10; display:flex; align-items:center; justify-content:space-between; padding:1.35rem 1.5rem; pointer-events:none; }
  .chip { pointer-events:auto; font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; color:var(--ink); text-decoration:none; background:var(--chip); -webkit-backdrop-filter:blur(9px); backdrop-filter:blur(9px); padding:.55rem .9rem; border-radius:999px; border:1px solid var(--chipbd); transition:border-color .25s ease; }
  a.chip:hover { border-color:var(--ink); }
  .topr { display:flex; flex-direction:column; align-items:flex-end; gap:.5rem; }
  .cam { font-size:.58rem; letter-spacing:.24em; text-transform:uppercase; color:var(--faint); padding-right:.15rem; }
  .hint { position:fixed; bottom:1.3rem; left:50%; transform:translateX(-50%); z-index:10; font-size:.64rem; letter-spacing:.32em; text-transform:uppercase; color:var(--faint); transition:opacity .7s ease; pointer-events:none; }
  .hint.gone { opacity:0; }
  #lightbox { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:4vmin; opacity:0; pointer-events:none; cursor:zoom-out; background:rgba(8,8,9,0); -webkit-backdrop-filter:blur(0); backdrop-filter:blur(0); transition:opacity .55s ease, background .55s ease, backdrop-filter .55s ease; }
  #lightbox.open { opacity:1; pointer-events:auto; background:rgba(8,8,9,0.93); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px); }
  #lightbox img { max-width:92vw; max-height:92vh; width:auto; height:auto; border-radius:4px; box-shadow:0 40px 100px rgba(0,0,0,0.6); transform:scale(.9); opacity:0; transition:transform .6s cubic-bezier(.16,1,.3,1), opacity .45s ease; }
  #lightbox.open img { transform:scale(1); opacity:1; }
  @media (prefers-reduced-motion: reduce){ .ph{ transition:none; } }
</style>
</head>
<body>
  <div class="top">
    <a class="chip" href="/">← Back</a>
    <div class="topr">
      <span class="chip">Photography</span>
      <span class="cam">Olympus Stylus · 35mm</span>
    </div>
  </div>
  <div class="hint" id="hint">drag to explore ↔</div>
  <div id="field"></div>
  <div id="lightbox" aria-hidden="true"><img alt="" /></div>
  <script>
  (function () {
    var N = 71, PHI = 0.6180339887498949;
    var field = document.getElementById('field'), hint = document.getElementById('hint');
    function two(n) { return (n < 10 ? '0' : '') + n; }
    function mod(a, n) { return ((a % n) + n) % n; }
    function fr(x) { return x - Math.floor(x); }
    var COLS = 10, ROWS = 8, CW = 335, CH = 455, TW = COLS * CW, TH = ROWS * CH, BUFX = 300, BUFY = 410;
    var photos = [];
    for (var i = 0; i < N; i++) {
      var el = document.createElement('div'); el.className = 'ph';
      var img = document.createElement('img'); img.decoding = 'async'; img.alt = '';
      var depth = fr(i * PHI);
      var w = Math.round(150 + depth * 95);          // 150..245, varied sizes
      el.style.width = w + 'px';
      var col = i % COLS, row = Math.floor(i / COLS);
      var jx = (fr(i * 0.7548776662) - 0.5) * 76;    // scattered, not gridded (±38)
      var jy = (fr(i * 0.5698402909) - 0.5) * 64;    // ±32
      var cxp = col * CW + CW / 2 + (row % 2) * (CW / 2) + jx;  // half-cell brick offset breaks the columns
      var cyp = row * CH + CH / 2 + jy;
      var bx = cxp - w / 2;
      var by = cyp - w * 1.15 / 2;                    // estimate; recentered on load with true height
      var p = { el: el, bx: bx, by: by, depth: depth, cyp: cyp };
      (function (p, el, img) {
        img.addEventListener('load', function () {
          el.classList.add('on');
          var h = el.offsetHeight || el.getBoundingClientRect().height;
          if (h) p.by = p.cyp - h / 2;                // center on its point using actual height
        });
      })(p, el, img);
      img.src = 'assets/photos/p' + two(i + 1) + '.jpg';
      el.appendChild(img); field.appendChild(el);
      photos.push(p);
    }
    var vw = innerWidth, vh = innerHeight;
    addEventListener('resize', function () { vw = innerWidth; vh = innerHeight; });
    // 2D pan state
    var ox = 0, oy = 0, tox = 0, toy = 0, vx = 0, vy = 0, mxs = 0, mys = 0, tmx = 0, tmy = 0;
    var dragging = false, moved = 0, lastX = 0, lastY = 0, downEl = null;
    function nudge() { if (!hint.classList.contains('gone')) hint.classList.add('gone'); }
    field.addEventListener('pointerdown', function (e) {
      if (lbOpen) return;
      dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY; vx = vy = 0;
      downEl = e.target.closest('.ph');
      field.classList.add('drag'); field.setPointerCapture && field.setPointerCapture(e.pointerId);
    });
    addEventListener('pointermove', function (e) {
      tmx = e.clientX / vw - 0.5; tmy = e.clientY / vh - 0.5;
      if (!dragging) return;
      var dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
      tox += dx; toy += dy; vx = dx; vy = dy; moved += Math.abs(dx) + Math.abs(dy);
      if (moved > 6) nudge();
    });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false; field.classList.remove('drag');
      if (moved < 6 && downEl) { openLb(downEl.querySelector('img').getAttribute('src')); }
      downEl = null;
    }
    addEventListener('pointerup', endDrag);
    addEventListener('pointercancel', endDrag);
    addEventListener('wheel', function (e) { if (lbOpen) { e.preventDefault(); return; } e.preventDefault(); tox -= e.deltaX; toy -= e.deltaY; vx = vy = 0; nudge(); }, { passive: false });
    // lightbox
    var lb = document.getElementById('lightbox'), lbImg = lb.querySelector('img'), lbOpen = false;
    function openLb(src) { lbImg.src = src; lbOpen = true; lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false'); }
    function closeLb() { if (!lbOpen) return; lbOpen = false; lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); }
    lb.addEventListener('click', closeLb);
    addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLb(); });
    function frame() {
      if (!dragging) { tox += vx; toy += vy; vx *= 0.93; vy *= 0.93; if (Math.abs(vx) < 0.04) vx = 0; if (Math.abs(vy) < 0.04) vy = 0; }
      ox += (tox - ox) * 0.13; oy += (toy - oy) * 0.13;
      mxs += (tmx - mxs) * 0.05; mys += (tmy - mys) * 0.05;
      for (var i = 0; i < N; i++) {
        var p = photos[i];
        var x = mod(p.bx + ox + BUFX, TW) - BUFX + mxs * p.depth * 9;
        var y = mod(p.by + oy + BUFY, TH) - BUFY + mys * p.depth * 9;
        p.el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
