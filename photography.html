<head>
<meta charset="UTF-8" />

<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="description" content="Photography by Arjun Kalbag." />
<meta property="og:title" content="Photography — Arjun Kalbag" />
<meta property="og:image" content="https://arjunkalbag.xyz/og-image.jpg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#ffffff; --ink:#111; --faint:#a2a2a2; --line:rgba(0,0,0,0.11); }
  html.dark { --bg:#0c0c0c; --ink:#f2f2f2; --faint:#5f5f5f; --line:rgba(255,255,255,0.13); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
         min-height:100vh; display:grid; place-items:center; opacity:0; animation:fade .8s ease forwards; transition:background .45s ease,color .45s ease; }
  @keyframes fade { to { opacity:1; } }
  .mono { font-family:'JetBrains Mono',monospace; }
  a { color:inherit; text-decoration:none; }
  .center { text-align:center; }
  h1 { font-weight:800; font-size:clamp(2.4rem,9vw,4.2rem); letter-spacing:-0.04em; }
  .soon { margin-top:1rem; font-size:0.72rem; letter-spacing:0.28em; text-transform:uppercase; color:var(--faint); }
  .back { position:fixed; top:1.4rem; left:1.4rem; font-size:0.72rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--faint); }
  .back:hover { color:var(--ink); }
</style>
</head>
<body>
  <a class="back mono" href="/">← Back</a>
  <div class="center">
    <h1>Photography</h1>
    <p class="soon mono">Coming soon</p>
  </div>
</body>
</html>
