<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Photography — Arjun Kalbag</title>
<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="description" content="Photography by Arjun Kalbag." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Photography — Arjun Kalbag" />
<meta property="og:image" content="https://arjunkalbag.xyz/og-image.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://arjunkalbag.xyz/og-image.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#f2f1ec; --ink:#141414; --faint:#8a8a8a; --chip:rgba(242,241,236,0.72); --chipbd:rgba(0,0,0,0.14); }
  html.dark { --bg:#0b0b0c; --ink:#f2f2f2; --faint:#7a7a7a; --chip:rgba(11,11,12,0.6); --chipbd:rgba(255,255,255,0.16); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); color:var(--ink); font-family:'JetBrains Mono',ui-monospace,monospace; cursor:default; -webkit-font-smoothing:antialiased; }
  #field { position:fixed; inset:0; overflow:hidden; z-index:1; }
  .ph { position:absolute; top:0; left:0; will-change:transform; opacity:0; transition:opacity 1s ease; }
  .ph.on { opacity:1; }
  .ph img { display:block; width:100%; height:auto; border-radius:3px; box-shadow:0 18px 50px rgba(0,0,0,0.28); background:rgba(128,128,128,0.1); transition:transform .6s cubic-bezier(.16,1,.3,1); cursor:zoom-in; }
  .ph:hover img { transform:scale(1.035); }
  #lightbox { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:4vmin; opacity:0; pointer-events:none; cursor:zoom-out; background:rgba(8,8,9,0); -webkit-backdrop-filter:blur(0); backdrop-filter:blur(0); transition:opacity .55s ease, background .55s ease, backdrop-filter .55s ease; }
  #lightbox.open { opacity:1; pointer-events:auto; background:rgba(8,8,9,0.93); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px); }
  #lightbox img { max-width:92vw; max-height:92vh; width:auto; height:auto; border-radius:4px; box-shadow:0 40px 100px rgba(0,0,0,0.6); transform:scale(.9); opacity:0; transition:transform .6s cubic-bezier(.16,1,.3,1), opacity .45s ease; }
  #lightbox.open img { transform:scale(1); opacity:1; }
  .top { position:fixed; top:0; left:0; right:0; z-index:10; display:flex; align-items:center; justify-content:space-between; padding:1.35rem 1.5rem; pointer-events:none; }
  .chip { pointer-events:auto; font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; color:var(--ink); text-decoration:none; background:var(--chip); -webkit-backdrop-filter:blur(9px); backdrop-filter:blur(9px); padding:.55rem .9rem; border-radius:999px; border:1px solid var(--chipbd); transition:border-color .25s ease; }
  a.chip:hover { border-color:var(--ink); }
  .hint { position:fixed; bottom:1.3rem; left:50%; transform:translateX(-50%); z-index:10; font-size:.64rem; letter-spacing:.32em; text-transform:uppercase; color:var(--faint); transition:opacity .7s ease; }
  .hint.gone { opacity:0; }
  @media (prefers-reduced-motion: reduce){ .ph{ transition:none; } .ph img{ transition:none; } }
</style>
</head>
<body>
  <div class="top">
    <a class="chip" href="/">← Back</a>
    <span class="chip">Photography</span>
  </div>
  <div class="hint" id="hint">scroll ↕</div>
  <div id="field"></div>
  <div id="lightbox" aria-hidden="true"><img alt="" /></div>
  <script>
  (function () {
    var N = 71, PHI = 0.6180339887498949;
    var field = document.getElementById('field'), hint = document.getElementById('hint');
    function two(n) { return (n < 10 ? '0' : '') + n; }
    function mod(a, n) { return ((a % n) + n) % n; }
    var photos = [];
    for (var i = 0; i < N; i++) {
      var el = document.createElement('div'); el.className = 'ph';
      var img = document.createElement('img'); img.decoding = 'async'; img.alt = '';
      (function (el) { img.addEventListener('load', function () { el.classList.add('on'); }); })(el);
      img.src = 'assets/photos/p' + two(i + 1) + '.jpg';
      el.appendChild(img); field.appendChild(el);
      photos.push({ el: el, fx: mod(0.5 + i * PHI, 1), depth: 0.8 + mod(i * 2 * PHI, 1) * 0.35, baseY: 0, x: 0 });
    }
    var vw, vh, STEP, H, margin = 22;
    function layout() {
      vw = innerWidth; vh = innerHeight;
      STEP = Math.max(300, vh * 0.5); H = N * STEP;
      for (var i = 0; i < N; i++) {
        var p = photos[i];
        var w = Math.round((0.15 + 0.17 * p.depth) * Math.min(vw, 1120));
        w = Math.max(150, Math.min(w, vw * 0.62));
        p.el.style.width = w + 'px';
        p.x = Math.round(margin + p.fx * (vw - w - margin * 2));
        p.baseY = i * STEP + vh * 0.14 + (mod(i * 3 * PHI, 1) - 0.5) * STEP * 0.5;
        p.el.style.zIndex = Math.round(p.depth * 100);
      }
    }
    layout(); addEventListener('resize', layout);
    var target = 0, cur = 0, tmx = 0, tmy = 0, mx = 0, my = 0, moved = false;
    function bump(dy) { target += dy; if (!moved) { moved = true; hint.classList.add('gone'); } }
    addEventListener('wheel', function (e) { e.preventDefault(); if (lbOpen) return; bump(e.deltaY); }, { passive: false });
    var ly = null;
    addEventListener('touchstart', function (e) { ly = e.touches[0].clientY; }, { passive: true });
    addEventListener('touchmove', function (e) { if (ly != null) { bump((ly - e.touches[0].clientY) * 1.6); ly = e.touches[0].clientY; } }, { passive: true });
    addEventListener('keydown', function (e) { if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') bump(170); else if (e.key === 'ArrowUp' || e.key === 'PageUp') bump(-170); });
    addEventListener('mousemove', function (e) { tmx = e.clientX / vw - 0.5; tmy = e.clientY / vh - 0.5; });
    function frame() {
      cur += (target - cur) * 0.072;
      mx += (tmx - mx) * 0.05; my += (tmy - my) * 0.05;
      for (var i = 0; i < N; i++) {
        var p = photos[i];
        var y = mod(p.baseY - cur * p.depth + vh, H) - vh + my * 20 * p.depth;
        var x = p.x + mx * 46 * p.depth;
        p.el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    // lightbox — click a photo to zoom full screen; click / Esc to close
    var lb = document.getElementById('lightbox'), lbImg = lb.querySelector('img'), lbOpen = false;
    field.addEventListener('click', function (e) {
      var el = e.target.closest('.ph'); if (!el) return;
      lbImg.src = el.querySelector('img').getAttribute('src');
      lbOpen = true; lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false');
    });
    function closeLb() { if (!lbOpen) return; lbOpen = false; lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); }
    lb.addEventListener('click', closeLb);
    addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLb(); });
  })();
  </script>
</body>
</html>
