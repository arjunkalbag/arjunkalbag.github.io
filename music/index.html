    <script>
        lucide.createIcons();
        gsap.registerPlugin(Observer);

        // ===== Gold custom cursor =====
        const cursor = document.getElementById('cursor');
        const follower = document.getElementById('cursor-follower');
        gsap.set([cursor, follower], { xPercent: -50, yPercent: -50 });
        window.addEventListener('mousemove', (e) => {
            gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0.1 });
            gsap.to(follower, { x: e.clientX, y: e.clientY, duration: 0.6, ease: 'power2.out' });
        });
        document.body.addEventListener('mouseenter', (e) => {
            if (e.target.closest('.hover-trigger')) gsap.to(cursor, { scale: 3, duration: 0.3 });
        }, true);
        document.body.addEventListener('mouseleave', (e) => {
            if (e.target.closest('.hover-trigger')) gsap.to(cursor, { scale: 1, duration: 0.3 });
        }, true);
        // Click ripple
        window.addEventListener('click', (e) => {
            const ripple = document.createElement('div');
            ripple.className = 'fixed rounded-full border pointer-events-none z-[99]';
            ripple.style.borderColor = '#C5A059';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            ripple.style.width = '40px';
            ripple.style.height = '40px';
            ripple.style.transform = 'translate(-50%, -50%) scale(0)';
            document.body.appendChild(ripple);
            gsap.to(ripple, { scale: 3, opacity: 0, duration: 0.6, onComplete: () => ripple.remove() });
        });

        // ===== Carousel =====
        let currentLogoIndex = 0;
        const logos = document.querySelectorAll('.music-logo');
        const totalLogos = logos.length;
        let isAnimating = false;
        let activeTextHideTimer;

        function handleTextVisibility(logoElement, show = true, reason = 'auto') {
            const text = logoElement.querySelector('.album-title');
            if (!text) return;
            gsap.killTweensOf(text);
            if (show) {
                if (reason === 'hover' && activeTextHideTimer) activeTextHideTimer.kill();
                gsap.to(text, { opacity: 1, duration: 0.5 });
                if (reason === 'auto') {
                    if (activeTextHideTimer) activeTextHideTimer.kill();
                    activeTextHideTimer = gsap.delayedCall(6, () => { gsap.to(text, { opacity: 0, duration: 1 }); });
                }
            } else {
                gsap.to(text, { opacity: 0, duration: 0.5 });
            }
        }

        logos.forEach(logo => {
            const link = logo.querySelector('a');
            if (link) {
                link.addEventListener('mouseenter', () => handleTextVisibility(logo, true, 'hover'));
                link.addEventListener('mouseleave', () => handleTextVisibility(logo, false, 'leave'));
            }
        });

        function moveCarousel(direction) {
            if (isAnimating) return;
            isAnimating = true;
            const currentLogo = logos[currentLogoIndex];
            const currentText = currentLogo.querySelector('.album-title');
            if (currentText) gsap.to(currentText, { opacity: 0, duration: 0.2 });
            let nextIndex;
            if (direction === 'next') nextIndex = (currentLogoIndex + 1) % totalLogos;
            else nextIndex = (currentLogoIndex - 1 + totalLogos) % totalLogos;
            const nextLogo = logos[nextIndex];
            const tl = gsap.timeline({
                onComplete: () => {
                    isAnimating = false;
                    currentLogoIndex = nextIndex;
                    handleTextVisibility(nextLogo, true, 'auto');
                }
            });
            if (direction === 'next') {
                gsap.set(nextLogo, { xPercent: -100, opacity: 0 });
                tl.to(currentLogo, { xPercent: 100, opacity: 0, duration: 1.2, ease: 'power3.inOut' })
                  .to(nextLogo, { xPercent: 0, opacity: 1, duration: 1.2, ease: 'power3.inOut' }, '<');
            } else {
                gsap.set(nextLogo, { xPercent: 100, opacity: 0 });
                tl.to(currentLogo, { xPercent: -100, opacity: 0, duration: 1.2, ease: 'power3.inOut' })
                  .to(nextLogo, { xPercent: 0, opacity: 1, duration: 1.2, ease: 'power3.inOut' }, '<');
            }
        }

        Observer.create({
            target: window,
            type: 'wheel,touch,pointer',
            onUp: () => moveCarousel('prev'),
            onDown: () => moveCarousel('next'),
            tolerance: 10,
            preventDefault: true
        });

        // Initialize: logo-1 visible, others offscreen; show first title
        gsap.set('.music-logo:not(#logo-1)', { xPercent: 100, opacity: 0 });
        gsap.set('#logo-1', { xPercent: 0, opacity: 1 });
        handleTextVisibility(document.getElementById('logo-1'), true, 'auto');

        // ===== Back to home (with fade) =====
        const backBtn = document.getElementById('music-back-btn');
        if (backBtn) {
            let leaving = false;
            const goHome = () => { if (leaving) return; leaving = true; window.location.href = '../'; };
            backBtn.addEventListener('click', () => {
                gsap.to('body', { opacity: 0, duration: 0.5, ease: 'power2.inOut', onComplete: goHome });
                setTimeout(goHome, 700);
            });
        }

        // Restore opacity if returned to via bfcache
        window.addEventListener('pageshow', (e) => { if (e.persisted) gsap.set('body', { opacity: 1 }); });
    </script>
